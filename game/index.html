<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>Flyping Blue — Game by Fikri Fidiansah</title>
  <meta name="description" content="Mainkan Flyping Blue, game 2D bergaya Flappy Bird karya Fikri Fidiansah. Hindari pipa dan raih skor tertinggi!" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b0d'/%3E%3Ctext x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='27' font-weight='700' fill='%2338bdf8' text-anchor='middle'%3EFF%3C/text%3E%3C/svg%3E" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0b0d;
      --panel: #101218;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e4e4e7;
      --muted: #a1a1aa;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(60% 50% at 50% 0%, #121722 0%, rgba(10, 11, 13, 0) 100%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .back:hover {
      color: var(--accent);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-decoration: none;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .stage-frame {
      position: relative;
      width: min(100%, 960px);
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      touch-action: none;
      user-select: none;
    }

    .stage-frame:fullscreen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    #stage {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0a0b0d;
      color: var(--muted);
      font-size: 13px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hud {
      width: min(100%, 960px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hud h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .hud p {
      margin: 6px 0 0;
      max-width: 46ch;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease, transform 0.15s ease;
    }

    .btn:hover {
      border-color: rgba(56, 189, 248, 0.5);
      color: #fff;
      background: rgba(56, 189, 248, 0.08);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .status {
      margin: 0;
      color: #71717a;
      font-size: 12px;
      min-height: 18px;
      text-align: center;
    }

    .status.is-error {
      color: #fca5a5;
    }

    @media (max-width: 640px) {
      main {
        padding: 18px 14px 28px;
      }

      .topbar {
        padding: 18px 14px 0;
      }

      .hud h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="back" href="../index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5m0 0l7 7m-7-7l7-7"></path>
      </svg>
      Kembali ke Portofolio
    </a>
    <a class="brand" href="../index.html" aria-label="Fikri Fidiansah, beranda">FF</a>
  </header>

  <main>
    <div class="stage-frame" id="stageFrame">
      <canvas id="stage" width="480" height="360" aria-label="Area permainan Flyping Blue"></canvas>
      <div class="loading" id="loading">
        <span class="spinner" aria-hidden="true"></span>
        <span>Memuat game…</span>
      </div>
    </div>

    <div class="hud">
      <div>
        <h1>Flyping Blue</h1>
        <p>Klik layar atau tekan <strong>Spasi</strong> untuk terbang. Hindari pipa dan raih skor
          setinggi mungkin!</p>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="restartBtn">Ulangi</button>
        <button type="button" class="btn" id="fullscreenBtn">Layar Penuh</button>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite">Menyiapkan mesin game…</p>
  </main>

  <noscript>
    <p style="text-align:center;color:#fca5a5;padding:0 24px 24px">Game ini memerlukan JavaScript untuk berjalan.</p>
  </noscript>

  <!-- Scratch runtime -->
  <script src="https://cdn.jsdelivr.net/npm/scratch-vm@5.0.300/dist/web/scratch-vm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-render@2.2.84/dist/web/scratch-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-svg-renderer@3.1.19/dist/web/scratch-svg-renderer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-storage@6.2.1/dist/web/scratch-storage.min.js"></script>

  <!-- scratch-audio dipublikasikan sebagai CommonJS; shim module/require di bawah agar bisa dimuat di browser -->
  <script>
    window.module = { exports: {} };
    window.exports = window.module.exports;
    window.require = function (name) {
      if (name === 'audio-context') {
        return function () {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) throw new Error('Browser tidak mendukung Web Audio API');
          return new AudioCtx();
        };
      }
      if (name === 'startaudiocontext') {
        return function (context) {
          if (!context || typeof document === 'undefined') return;
          var resume = function () {
            if (context.state === 'suspended' && typeof context.resume === 'function') context.resume();
          };
          ['pointerdown', 'keydown', 'touchstart'].forEach(function (eventName) {
            document.addEventListener(eventName, resume, { passive: true });
          });
        };
      }
      if (name === 'minilog') {
        var minilog = function () { return minilog; };
        minilog.enable = function () { };
        minilog.disable = function () { };
        minilog.debug = minilog.info = minilog.warn = minilog.error = function () { };
        return minilog;
      }
      throw new Error('Modul tidak dikenal: ' + name);
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/scratch-audio@2.0.271/dist.js"></script>
  <script>
    window.ScratchAudioEngine = window.module.exports;
  </script>

  <!-- Data project + player -->
  <script src="project-data.js"></script>
  <script src="app.js"></script>
</body>

</html>
